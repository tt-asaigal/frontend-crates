name: ci

on:
  push:
    # `pull-request/<n>` is the internal mirror branch copy-pr-bot pushes after a
    # maintainer runs `/ok to test <sha>`. External contributions run CI from the
    # mirror so maintainers vet the code before it executes with repo access.
    branches:
      - main
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The conformance jobs validate the maintained viewer and source resources and
  # run only for conformance/parser changes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect conformance/parser changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            conformance:
              - 'conformance/**'
              - 'parsers/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'index.html'
              - '.github/workflows/ci.yml'

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_DENY_VERSION: "0.19.4"
      CARGO_MACHETE_VERSION: "0.9.2"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Fixture shards live in-repo under conformance/fixtures/ via git-lfs;
          # cargo test extracts them locally (extract_fixtures.py, stdlib-only).
          lfs: true
          # Release identity compares parser source with the release tag.
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache cargo tools
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
          key: ${{ runner.os }}-cargo-tools-deny-${{ env.CARGO_DENY_VERSION }}-machete-${{ env.CARGO_MACHETE_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tools-

      - name: Install cargo tools
        run: |
          cargo-deny --version 2>/dev/null | grep -qF "${CARGO_DENY_VERSION}" || cargo install "cargo-deny@${CARGO_DENY_VERSION}" --locked
          cargo-machete --version 2>/dev/null | grep -qF "${CARGO_MACHETE_VERSION}" || cargo install "cargo-machete@${CARGO_MACHETE_VERSION}" --locked

      - name: Check unused dependencies
        run: cargo machete

      - name: Check dependency policy
        run: cargo deny --all-features check bans licenses

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      # Video tests use libvpx for CPU decoding on runners without an NVIDIA GPU.
      - name: Install libvpx
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvpx9

      - name: Run multimodal tests with all features
        run: cargo test -p dynamo-multimodal --all-targets --all-features --locked

      - name: Run parser recovery work-bound tests
        run: cargo test --locked -p dynamo-parsers-v2 --features test-utils --test gemma4_native_recovery

      - name: Run doctests
        run: cargo test --workspace --doc --locked

      - name: Run protocol schema tests
        run: cargo test -p dynamo-protocols --features protocol-schema --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify crates are publishable
        run: cargo publish --workspace --dry-run --locked

  # Validate the maintained conformance viewer and its source resources.
  # Python + PyYAML/Selenium — no engines (vLLM/SGLang conformance runs in
  # dynamo's CI lanes; here the engine lanes are on-demand/local).
  pages-build:
    needs: changes
    if: ${{ needs.changes.outputs.conformance == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CONFORMANCE_PUBLISHER: ${{ github.workspace }}/target/release/conformance-publish
    steps:
      - name: Checkout publication sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          fetch-depth: 0
      - name: Configure publication output
        run: |
          printf 'CONFORMANCE_PUBLISHED_SITE=%s/pages\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CONFORMANCE_ESBUILD_ROOT=%s/conformance-viewer-build\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked production JavaScript bundler
        run: |
          mkdir -p "$CONFORMANCE_ESBUILD_ROOT"
          \cp -f conformance/viewer/package.json conformance/viewer/package-lock.json "$CONFORMANCE_ESBUILD_ROOT/"
          npm ci --prefix "$CONFORMANCE_ESBUILD_ROOT" --ignore-scripts
      - name: Build and test native publisher
        run: |
          cargo build --locked --release -p conformance-publisher
          cargo test --locked --release -p conformance-publisher
      - name: Generate source catalog inputs
        run: |
          python3 -m venv "$RUNNER_TEMP/publication-venv"
          "$RUNNER_TEMP/publication-venv/bin/pip" install --quiet pyyaml pytest selenium
          "$RUNNER_TEMP/publication-venv/bin/python3" conformance/utils/src/viewer_catalog.py
      - name: Publish native site
        run: '"$CONFORMANCE_PUBLISHER" --root "$GITHUB_WORKSPACE" --output "$CONFORMANCE_PUBLISHED_SITE" --revision "$GITHUB_SHA"'
      - name: Qualify resolved data and Chromium Pages routes
        run: |
          "$RUNNER_TEMP/publication-venv/bin/python3" -m pytest conformance/utils/tests/test_native_publication_browser.py conformance/utils/tests/test_viewer_snapshot_parity.py::test_full_corpus_json_snapshots_match_python_and_javascript_resolution -vv --durations=25
      - name: Package qualified site and matching binary
        run: |
          mkdir -p "$RUNNER_TEMP/native-publication"
          tar -C "$CONFORMANCE_PUBLISHED_SITE" -cf "$RUNNER_TEMP/native-publication/native-pages.tar" .
          test "$(stat -c %s "$RUNNER_TEMP/native-publication/native-pages.tar")" -lt 1000000000
          \cp -f "$CONFORMANCE_PUBLISHER" "$RUNNER_TEMP/native-publication/conformance-publish"
          tar -cf "$RUNNER_TEMP/native-publication/source-catalogs.tar" conformance/viewer-catalog.json conformance/viewer-unified-catalog.json
      - name: Retain qualified inputs for conformance shards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-native-publication
          path: ${{ runner.temp }}/native-publication/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  conformance-core:
    needs: [changes, pages-build]
    if: ${{ needs.changes.outputs.conformance == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Fixture shards live in-repo under conformance/fixtures/ via git-lfs;
          # the render + guard steps extract them locally on first use.
          lfs: true
          # The renderer needs release tags to distinguish releases from changed source.
          fetch-depth: 0

      # The browser smoke file has three module-scoped Chrome drivers and is kept
      # on its own runner to avoid contending with the file-level pytest workers.
      - name: Configure qualified publication paths
        run: |
          printf 'CONFORMANCE_PUBLISHER=%s/native-publication/conformance-publish\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CONFORMANCE_PUBLISHED_SITE=%s/pages\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Download qualified native publication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conformance-native-publication
          path: ${{ runner.temp }}/native-publication
      - name: Restore qualified site and binary
        run: |
          chmod u+x "$RUNNER_TEMP/native-publication/conformance-publish"
          mkdir -p "$RUNNER_TEMP/pages"
          tar -xf "$RUNNER_TEMP/native-publication/native-pages.tar" -C "$RUNNER_TEMP/pages"
          tar -xf "$RUNNER_TEMP/native-publication/source-catalogs.tar" -C "$GITHUB_WORKSPACE"

      - name: Conformance core shard (catalog + lint + invariants)
        run: |
          python3 -m venv /tmp/pvenv
          /tmp/pvenv/bin/pip install --quiet pyyaml pytest pytest-xdist selenium
          PATH="/tmp/pvenv/bin:$PATH" PYTEST_ADDOPTS="-vv --numprocesses=4 --dist=loadfile --no-loadscope-reorder --durations=25" CONFORMANCE_CI_SHARD=core conformance/utils/check.sh ci

  conformance-browser:
    needs: [changes, pages-build]
    if: ${{ needs.changes.outputs.conformance == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true

      - name: Configure qualified publication paths
        run: |
          printf 'CONFORMANCE_PUBLISHER=%s/native-publication/conformance-publish\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CONFORMANCE_PUBLISHED_SITE=%s/pages\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Download qualified native publication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conformance-native-publication
          path: ${{ runner.temp }}/native-publication
      - name: Restore qualified site and binary
        run: |
          chmod u+x "$RUNNER_TEMP/native-publication/conformance-publish"
          mkdir -p "$RUNNER_TEMP/pages"
          tar -xf "$RUNNER_TEMP/native-publication/native-pages.tar" -C "$RUNNER_TEMP/pages"
          tar -xf "$RUNNER_TEMP/native-publication/source-catalogs.tar" -C "$GITHUB_WORKSPACE"

      - name: Conformance browser shard
        run: |
          python3 -m venv /tmp/pvenv
          /tmp/pvenv/bin/pip install --quiet pyyaml pytest selenium
          PATH="/tmp/pvenv/bin:$PATH" CONFORMANCE_CI_SHARD=browser conformance/utils/check.sh ci

  # This module's Selenium runs contend with the Node model-contract test under
  # xdist, so keep it on a separate runner from the core and smoke shards.
  conformance-viewer:
    needs: [changes, pages-build]
    if: ${{ needs.changes.outputs.conformance == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true

      - name: Configure qualified publication paths
        run: |
          printf 'CONFORMANCE_PUBLISHER=%s/native-publication/conformance-publish\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CONFORMANCE_PUBLISHED_SITE=%s/pages\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Download qualified native publication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conformance-native-publication
          path: ${{ runner.temp }}/native-publication
      - name: Restore qualified site and binary
        run: |
          chmod u+x "$RUNNER_TEMP/native-publication/conformance-publish"
          mkdir -p "$RUNNER_TEMP/pages"
          tar -xf "$RUNNER_TEMP/native-publication/native-pages.tar" -C "$RUNNER_TEMP/pages"
          tar -xf "$RUNNER_TEMP/native-publication/source-catalogs.tar" -C "$GITHUB_WORKSPACE"

      - name: Conformance viewer browser shard
        run: |
          python3 -m venv /tmp/pvenv
          /tmp/pvenv/bin/pip install --quiet pyyaml pytest selenium
          PATH="/tmp/pvenv/bin:$PATH" CONFORMANCE_CI_SHARD=viewer conformance/utils/check.sh ci

  # The first-visible-matrix tests each start an independent Chrome profile.
  # Keep those initial-load checks on their own runner to bound the smoke shard.
  conformance-first-matrix:
    needs: [changes, pages-build]
    if: ${{ needs.changes.outputs.conformance == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true

      - name: Configure qualified publication paths
        run: |
          printf 'CONFORMANCE_PUBLISHER=%s/native-publication/conformance-publish\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CONFORMANCE_PUBLISHED_SITE=%s/pages\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Download qualified native publication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conformance-native-publication
          path: ${{ runner.temp }}/native-publication
      - name: Restore qualified site and binary
        run: |
          chmod u+x "$RUNNER_TEMP/native-publication/conformance-publish"
          mkdir -p "$RUNNER_TEMP/pages"
          tar -xf "$RUNNER_TEMP/native-publication/native-pages.tar" -C "$RUNNER_TEMP/pages"
          tar -xf "$RUNNER_TEMP/native-publication/source-catalogs.tar" -C "$GITHUB_WORKSPACE"

      - name: First visible matrix browser shard
        run: |
          python3 -m venv /tmp/pvenv
          /tmp/pvenv/bin/pip install --quiet pyyaml pytest selenium
          PATH="/tmp/pvenv/bin:$PATH" CONFORMANCE_CI_SHARD=first-matrix conformance/utils/check.sh ci

  # Preserve one stable required status and publish only after every test shard passes.
  conformance-table:
    needs: [changes, rust, pages-build, conformance-core, conformance-browser, conformance-viewer, conformance-first-matrix]
    if: ${{ always() && (needs.changes.outputs.conformance == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
      pull-requests: write
    steps:
      - name: Require all conformance shards
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          PAGES_RESULT: ${{ needs.pages-build.result }}
          CORE_RESULT: ${{ needs.conformance-core.result }}
          BROWSER_RESULT: ${{ needs.conformance-browser.result }}
          VIEWER_RESULT: ${{ needs.conformance-viewer.result }}
          FIRST_MATRIX_RESULT: ${{ needs.conformance-first-matrix.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$PAGES_RESULT" = success
          test "$CORE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$VIEWER_RESULT" = success
          test "$FIRST_MATRIX_RESULT" = success

      - name: Download qualified Pages input after required checks
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conformance-native-publication
          path: ${{ runner.temp }}/native-publication
      - name: Restore qualified Pages directory
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          tar -xf "$RUNNER_TEMP/native-publication/native-pages.tar" -C "$RUNNER_TEMP/pages"
      - name: Configure GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/pages

      - name: Comment on PR
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pull-request/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${GITHUB_REF_NAME#pull-request/}"
          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none \
            --body "📊 **Parser conformance viewer** validated — [view in CI summary](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

  deploy-pages:
    name: Deploy conformance matrix to GitHub Pages
    needs: conformance-table
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
